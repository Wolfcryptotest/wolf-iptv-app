name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk WolfIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WolfIPTV-apk
          path: WolfIPTV.apk

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Wolf IPTV 1.0.${{ github.run_number }}
          files: WolfIPTV.apk
          make_latest: true
          body: |
            Telefon / tablet / Android TV için Wolf IPTV.
            Kurulum: WolfIPTV.apk dosyasını telefona indir, aç, "Bilinmeyen kaynaklara izin ver" de ve yükle.
